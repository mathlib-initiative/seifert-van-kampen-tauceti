# Hold pdf-overlay/ to the record the generator wrote.
#
# Written once by `cf informalize overlay` (docs/proposals/informalize.md section 10) and
# the output repository's from then on. `check_generated.py` needs nothing but Python and
# this directory: it reads GENERATED.json and refuses a missing, changed or extra file, a
# config it would not accept, an annotation the bundle does not hold, a stale export and a
# verso.json that is not of a commit the cards pin.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the generated overlay
        run: python3 pdf-overlay/tools/check_generated.py
